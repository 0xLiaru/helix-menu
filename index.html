<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0b0e" />
  <title>Helix Bar & Drink | Menü</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            amber: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen text-stone-200 antialiased selection:bg-amber-500 selection:text-black">

  <!-- Mobil Uyumlu Ana Konteyner -->
  <div class="relative z-10 max-w-lg mx-auto min-h-screen pb-12">

    <!-- ÜST NAVBAR -->
    <header class="glass-nav sticky top-0 z-40 px-4 py-3 flex items-center justify-between border-b border-stone-800/80">
      <div onclick="showHomeCategories()" class="flex items-center gap-2.5 cursor-pointer">
        <!-- Orijinal Yuvarlak Helix Tabelası (Koyu Temayla Uyumlu) -->
        <div class="w-10 h-10 rounded-full bg-stone-900 border-2 border-amber-500/50 text-stone-200 flex items-center justify-center p-0.5 shadow-md flex-shrink-0">
          <div class="w-full h-full rounded-full border border-stone-700/80 flex flex-col items-center justify-center text-center">
            <span class="font-extrabold text-[11px] leading-none tracking-tighter text-white">Helix</span>
            <span class="text-[6.5px] tracking-tight leading-none text-amber-400 font-semibold mt-0.5">bar&amp;drink</span>
          </div>
        </div>
        <div>
          <h1 class="font-display font-bold tracking-wide text-base text-white leading-tight">
            Helix Bar &amp; Drink
          </h1>
          <p class="text-[10px] text-stone-400 tracking-wide">Çanakkale • Matbaa Sokak</p>
        </div>
      </div>

      <!-- Sağ: Dil Değiştirici -->
      <div>
        <button 
          id="lang-toggle-btn"
          onclick="toggleLanguage()"
          class="px-3.5 py-1.5 rounded-xl bg-stone-900 border border-stone-800 text-stone-300 hover:text-white font-bold text-xs transition-colors"
        >
          EN
        </button>
      </div>
    </header>

    <!-- Arka Plandaki İkonik Helix Tabelası İçin Üst Açık Boşluk (Telefonda Tam Görünür) -->
    <div class="h-60 sm:h-64 flex items-end px-5 pb-3">
      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/60 backdrop-blur-md border border-white/15 text-stone-200 text-xs shadow-lg">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="font-medium">Kemalpaşa Mah. Matbaa Sokak</span>
      </div>
    </div>

    <!-- 1. GÖRÜNÜM: SADECE KATEGORİLER (EN ÇOK SATAN KAPAK FOTOĞRAFLARI İLE) -->
    <section id="home-categories-view" class="px-5 pt-1 space-y-3.5">
      <div class="flex items-center justify-between pt-1 pb-0.5">
        <span class="text-xs font-bold text-stone-300 uppercase tracking-wider">Menü Kategorileri</span>
        <span class="text-[11px] text-amber-400 font-medium">Kategori Seçin</span>
      </div>

      <!-- Kategori Kapak Kartları Listesi -->
      <div id="category-cards-container" class="grid grid-cols-1 gap-3.5">
        <!-- JS ile dinamik doldurulur -->
      </div>
    </section>

    <!-- 2. GÖRÜNÜM: KATEGORİ İÇERİĞİ / ÜRÜN LİSTESİ (VARSAYILAN GİZLİ) -->
    <section id="products-view" class="hidden px-5 py-2">
      <!-- Kategoriye Geri Dönme Butonu ve Başlık -->
      <div class="sticky top-[61px] z-30 -mx-5 px-5 py-3 bg-[#0a0b0e]/95 backdrop-blur-md border-b border-stone-800/80 mb-4">
        <div class="flex items-center justify-between">
          <button 
            onclick="showHomeCategories()"
            class="flex items-center gap-1.5 text-xs font-bold text-amber-400 hover:text-amber-300 bg-stone-900/90 border border-stone-800 px-3 py-1.5 rounded-xl transition-colors"
          >
            <span>←</span>
            <span id="back-to-categories-text">Kategoriler</span>
          </button>
          
          <div class="text-right">
            <div id="current-category-title" class="font-bold text-white text-sm">Kokteyller</div>
            <div id="category-count-text" class="text-[10px] text-stone-500 font-mono"></div>
          </div>
        </div>

        <!-- Alt Filtreler (Örn: Viski, Votka, Cin veya Fıçı, Şişe) -->
        <div id="sub-filters-container" class="hidden flex items-center gap-2 overflow-x-auto no-scrollbar pt-2.5">
          <!-- JS ile doldurulur -->
        </div>
      </div>

      <!-- Ürün Kartları Grid -->
      <div id="products-grid" class="grid grid-cols-1 gap-3">
        <!-- JS ile doldurulur -->
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="mt-8 px-5 py-8 border-t border-stone-900/80 text-center space-y-2">
      <div class="font-display font-bold text-stone-400 text-sm tracking-widest">HELIX BAR & DRINK</div>
      <p class="text-xs text-stone-500">Kemalpaşa Mah. Matbaa Sok. No:7/2, Çanakkale</p>
      <div class="flex items-center justify-center gap-2 text-xs text-stone-400 pt-1">
        <a href="https://instagram.com/helixeatdrink" target="_blank" class="text-amber-400/90 hover:underline">
          Instagram: @helixeatdrink
        </a>
      </div>
    </footer>

  </div>

  <!-- ÜRÜN DETAY MODALI (Bottom Sheet) -->
  <div id="modal-container" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center modal-backdrop p-0 sm:p-4 transition-all">
    <div id="modal-body" class="w-full flex justify-center"></div>
  </div>

  <!-- Scriptler -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
